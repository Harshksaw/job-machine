services:
  jobs-db:
    image: postgres:17          # must match RDS major (17.9) or pg_dump/restore aborts
    container_name: jobs-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localjobs
      POSTGRES_DB: job_registry
    ports:
      - "5433:5432"          # host 5433 -> avoid clashing with any local 5432
    volumes:
      - jobs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_registry"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jobs_pgdata:
