projects:
  - id: orchestrator
    name: "Remote Orchestrator: Self-Hosted AI Agent Control Plane"
    tech: "Go, TypeScript, Next.js, PostgreSQL, WebSockets, Protobuf, tmux"
    demo_url: ""
    repo_url: "https://github.com/Harshksaw/agent-control-pane"
    bullets:
      - id: project.orchestrator.bullet.1
        text: "Designed a distributed control plane in **Go** that runs Claude Code, Codex, and other CLI agents across self-hosted machines through worker daemons and a versioned **Protocol Buffers** protocol over **WebSockets**."
      - id: project.orchestrator.bullet.2
        text: "Built persistent remote terminal sessions on **PTYs** and **tmux** with live streaming, interactive execution, and reattach after network or control-plane drops."
      - id: project.orchestrator.bullet.3
        text: "Added a fault-tolerant execution lifecycle (heartbeat monitoring, backoff reconnects, leases, cancellation, and resource budgets) with human-in-the-loop approvals and auditable run histories in a **Next.js** dashboard backed by **PostgreSQL**."
  - id: docintel
    name: "Document Intelligence Platform (RAG)"
    tech: "FastAPI, LangChain, Qdrant, Groq, Google Gemini, AWS ECS Fargate, Docker"
    demo_url: "https://aidoc.harshsaw.ca/"
    repo_url: "https://github.com/Harshksaw/document_portal"
    bullets:
      - id: project.docintel.bullet.1
        text: "Architected a multi-tenant **RAG** platform with session-isolated **Qdrant** indexes, enabling semantic search and conversational Q&A over PDF, DOCX, and TXT documents."
      - id: project.docintel.bullet.2
        text: "Engineered resilient LLM orchestration using **LangChain RunnableWithFallbacks**, implementing automatic provider failover (Groq to Gemini) with streaming retrieval pipelines featuring context-aware query rewriting and hybrid document chunking."
      - id: project.docintel.bullet.3
        text: "Deployed to **AWS ECS Fargate** with **GitHub Actions** CI/CD and multi-worker Uvicorn scaling; designed idempotent ingestion using **SHA-256** fingerprinting to deduplicate embeddings and reduce redundant indexing."
