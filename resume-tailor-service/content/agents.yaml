# Default agent orchestrator config. Committed, so it holds NO secrets: an adapter names
# the env var that carries its key (`key_env`) and the key itself stays in .env.
#
# This file is only the seed. On first start, or on "Reset to defaults", it is copied
# into the `pipeline_config` store; after that the stored config wins and the service
# never writes this file. Spec: docs/superpowers/specs/2026-11-26-agent-orchestrator-design.md
# sections 5 and 13.5.
#
# Command placeholders: {prompt} (required for cli), {schema} (the step's JSON schema).
# sdk adapters take a Pydantic AI model string, provider:model, with provider one of
# openrouter, openai, anthropic, google (google-gla), ollama; `tools` are built in read
# only tools (web_fetch, dossier_read) and `mcp` names entries of `mcp_servers`.
# `family` is the tool name used by app/agent_health.py and tools/ai-meter, so a blocked
# or over budget tool drops out of every chain that uses it.
workers: 4
adapters:
  gemini_lite:
    type: api
    provider: gemini
    model: gemini-3.5-flash-lite
    key_env: GEMINI_API_KEY
    family: gemini
    capabilities: [cheap]
    cost_tier: 1
    max_parallel: 4
  claude_haiku:
    type: cli
    # No tools under isolation, so the answer comes back on stdout, not in a file.
    command: [claude, -p, "{prompt}", --output-format, json, --model, haiku, --json-schema, "{schema}"]
    isolation: claude_hermetic
    output: stdout
    family: claude
    capabilities: [cheap, reason]
    cost_tier: 2
    max_parallel: 2
  codex:
    type: cli
    command: [codex, exec, -s, workspace-write, -c, sandbox_workspace_write.network_access=true, "{prompt}"]
    family: codex
    capabilities: [reason, web, browser_read]
    cost_tier: 3
    max_parallel: 2
  cursor:
    type: cli
    command: [cursor-agent, -p, --force, --trust, --model, grok-4.7-medium, --output-format, text, "{prompt}"]
    family: cursor
    capabilities: [reason, web, browser_read]
    cost_tier: 3
    max_parallel: 2
  opencode_free:
    type: cli
    command: [opencode, run, -m, opencode/big-pickle, "{prompt}"]
    family: opencode
    capabilities: [web]
    cost_tier: 1
    max_parallel: 1
  antigravity:
    type: cli
    command: [agy, --dangerously-skip-permissions, -p, "{prompt}"]
    family: antigravity
    capabilities: [reason, web, browser_read]
    cost_tier: 3
    max_parallel: 1
  openrouter_haiku:
    # In process agent on Pydantic AI (spec 13.1). One OpenRouter key reaches many
    # vendors, so losing one is a model string change. Without OPENROUTER_API_KEY in
    # .env the router skips it.
    type: sdk
    model: "openrouter:anthropic/claude-haiku-4.5"
    key_env: OPENROUTER_API_KEY
    family: openrouter
    tools: [web_fetch, dossier_read]
    capabilities: [cheap, reason, web]
    cost_tier: 2
    max_parallel: 2
    enabled: false
  gemini_flash:
    # The same in process agent on a direct Google AI Studio key.
    type: sdk
    model: "google:gemini-3.5-flash"
    key_env: GEMINI_API_KEY
    family: gemini
    tools: [web_fetch, dossier_read]
    capabilities: [cheap, reason, web]
    cost_tier: 2
    max_parallel: 2
    enabled: false
capability_caps:
  browser_read: 2
steps: {}
# MCP servers an sdk adapter may name in its `mcp` list, for example:
#   fetch: {command: [uvx, mcp-server-fetch]}
mcp_servers: {}
